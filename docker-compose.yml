services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrape
      POSTGRES_PASSWORD: scrape
      POSTGRES_DB: scrape
    ports:
      - "5436:5432"
    volumes:
      - scrape_pg:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://scrape:scrape@db:5432/scrape
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      APP_BASE_URL: http://web:3000
    depends_on:
      - db

  worker:
    profiles: ["with-worker"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://scrape:scrape@db:5432/scrape
      PIPELINE_CRON: "*/2 * * * *"
      MOCK_SOURCE: fixture
      APP_BASE_URL: http://web:3000
      MOCK_FEED_URL: http://web:3000/mock-feed
    command: ["sh", "-c", "npm ci && npx prisma generate && npx prisma migrate deploy && npm run worker"]
    depends_on:
      - db
      - web

volumes:
  scrape_pg:
